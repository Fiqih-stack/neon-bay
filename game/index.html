<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — a 2D open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  /* The canvas fills the window; the renderer letterboxes the 1280x720
     view inside it, so the game looks the same at any window size. */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0916;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }
  /* Screen-reader status line: in the page, but never on screen. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Bay game canvas"></canvas>
<div id="status" aria-live="polite">Neon Bay. Press Enter or click to start.</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
